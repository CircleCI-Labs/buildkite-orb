description: >
  Resolve a Buildkite plugin reference and git clone it at the pinned ref, cached.
  Accepts the same reference forms Buildkite itself accepts: a bare name (resolved
  against the `buildkite-plugins` GitHub org), an `org/name` shorthand, or a full
  `https://`/`ssh://`/`file://` git URL - each optionally followed by `#ref` and, for
  full URLs, an optional in-repo subdirectory. Exports BUILDKITE_PLUGIN_ROOT (the
  directory containing the plugin's plugin.yml and hooks/) and BUILDKITE_PLUGIN_NAME /
  BUILDKITE_PLUGIN_ENV_PREFIX (derived following Buildkite's own documented plugin
  naming convention) into $BASH_ENV for the `configure` and `run-hooks` commands to use.
  Also warns (non-fatally) if plugin.yml's `requirements:` list names a command that
  isn't on $PATH - Buildkite agents never install these either, so a missing one would
  otherwise surface as a confusing failure deep inside a hook instead.

parameters:
  plugin:
    type: string
    description: >
      The Buildkite plugin reference, e.g. "vault-secrets#v2.4.2",
      "equinixmetal-buildkite/trivy#v1.22.0", or
      "https://github.com/my-org/my-plugins.git/my-plugin#v1.0.0". Pinning a ref
      (#tag or #sha) is strongly recommended, matching Buildkite's own guidance.
  plugin-dir:
    type: string
    default: /tmp/buildkite-plugin
    description: Directory the plugin's repository is cloned into.
  plugin-cache:
    type: boolean
    default: true
    description: >
      Cache the cloned plugin repository using CircleCI caching, keyed on the plugin
      reference string. Only ever reused when the reference is pinned to a tag or
      commit SHA (#ref) - an unpinned reference (a mutable branch, or no #ref at all)
      always re-clones fresh, on every run, since a stable key computed from it would
      otherwise cache the clone once and reuse it forever.
  always-clone-fresh:
    type: boolean
    default: false
    description: >
      Force a fresh clone even if a cached or already-cloned copy is present, mirroring
      Buildkite's own BUILDKITE_PLUGINS_ALWAYS_CLONE_FRESH. Useful while iterating on a
      plugin against a mutable ref such as a branch.
  cache-key-prefix:
    type: string
    default: v1
    description: Prefixes a string to all cache keys.

steps:
  - when:
      condition: << parameters.plugin-cache >>
      steps:
        - run:
            name: Recording plugin reference for cache key
            environment:
              ORB_VAL_PLUGIN: << parameters.plugin >>
            command: |
              echo "$ORB_VAL_PLUGIN" > /tmp/.buildkite-plugin-ref
        - run:
            # restore_cache extracts on top of whatever is already at plugin-dir rather
            # than clearing it first. Without this, calling fetch-plugin twice against
            # the same default plugin-dir for two DIFFERENT plugins in the same
            # pipeline history can restore plugin B's cache on top of plugin A's
            # leftover checkout - the staleness guard in fetch-plugin.sh only checks
            # that _resolved_ref matches the requested ref, which it correctly does for
            # B, so a hook file unique to A (that B doesn't ship) can silently survive
            # on disk and get run as if it belonged to B. Always start from empty so a
            # cache hit only ever extracts into a clean directory.
            name: Clearing plugin-dir before cache restore
            environment:
              ORB_VAL_PLUGIN_DIR: << parameters.plugin-dir >>
            command: rm -rf "$ORB_VAL_PLUGIN_DIR"
        - restore_cache:
            name: Restoring cache for Buildkite plugin clone...
            keys:
              - << parameters.cache-key-prefix >>-buildkite-plugin-{{ arch }}-{{ checksum "/tmp/.buildkite-plugin-ref" }}
  - run:
      name: Resolving and fetching Buildkite plugin
      environment:
        ORB_VAL_PLUGIN: << parameters.plugin >>
        ORB_VAL_PLUGIN_DIR: << parameters.plugin-dir >>
        ORB_VAL_ALWAYS_CLONE_FRESH: << parameters.always-clone-fresh >>
      command: <<include(scripts/fetch-plugin.sh)>>
  - when:
      condition: << parameters.plugin-cache >>
      steps:
        - save_cache:
            name: Saving cache for Buildkite plugin clone...
            key: << parameters.cache-key-prefix >>-buildkite-plugin-{{ arch }}-{{ checksum "/tmp/.buildkite-plugin-ref" }}
            paths:
              - << parameters.plugin-dir >>

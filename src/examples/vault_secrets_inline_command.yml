description: |
  Run the vault-secrets Buildkite plugin inline, among your own native CircleCI steps,
  using the `plugin` command rather than the job. The plugin's environment hook reads
  VAULT_SECRET_ID (set here from a CircleCI context) and exports the secrets it fetches
  from Vault as plain environment variables that the native `run` step after it can
  read directly - this is the interleaving the command form exists for. Needs a real
  Vault server and a context providing VAULT_SECRET_ID; it will not run credential-free.

usage:
  version: 2.1
  orbs:
    buildkite: cci-labs/buildkite@x.y.z
  jobs:
    deploy:
      docker:
        - image: cimg/base:current
      steps:
        - checkout
        - buildkite/plugin:
            plugin: "vault-secrets#v2.4.2"
            config: |
              server: "https://my-vault-server"
              path: secret/buildkite
              auth:
                method: "approle"
                role-id: "my-role-id"
                secret-env: "VAULT_SECRET_ID"
        - run:
            name: Deploy using the secrets Vault just exported
            command: ./deploy.sh
  workflows:
    main:
      jobs:
        - deploy:
            context: vault-secrets

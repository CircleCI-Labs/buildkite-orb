version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5.0
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  buildkite: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Exercises fetch-plugin's reference resolution (bare name, full git URL, the
  # "-buildkite-plugin"-suffix vs. "_GIT"-suffix naming rule), configure's YAML
  # flattening, and run-hooks' cross-process environment-diff threading - all
  # credential-free, against the orb's own bundled fixture plugin plus one real,
  # bare-name-referenced plugin (fetched but not run, so no Vault server is needed).
  test_resolution_config_and_env_threading:
    docker:
      - image: cimg/base:current
    working_directory: /home/circleci/project
    steps:
      - checkout
      - run:
          name: Build two throwaway git repos from the bundled test fixture
          command: |
            set -euo pipefail
            # Scoped to this step's own git invocations only -- never touch global/local
            # git config (see this repo's contributor guidance: an earlier incident
            # polluted commit history by setting `git config --global user.email` during
            # testing). GIT_AUTHOR_*/GIT_COMMITTER_* env vars are the correct, unscoped-
            # config way to give a throwaway fixture repo a commit identity.
            export GIT_AUTHOR_NAME="orb test" GIT_AUTHOR_EMAIL="test@example.com"
            export GIT_COMMITTER_NAME="orb test" GIT_COMMITTER_EMAIL="test@example.com"

            # A repo named "*-buildkite-plugin" - the common case.
            rm -rf /tmp/hello-buildkite-plugin
            cp -r test/fixtures/hello-buildkite-plugin /tmp/hello-buildkite-plugin
            git -C /tmp/hello-buildkite-plugin init -q -b main
            git -C /tmp/hello-buildkite-plugin add -A
            git -C /tmp/hello-buildkite-plugin commit -q -m fixture

            # A repo that does NOT end in "-buildkite-plugin" - exercises the _GIT
            # env-prefix suffix rule for plugins referenced by a full git URL.
            rm -rf /tmp/plain-repo
            mkdir -p /tmp/plain-repo/hooks
            cat > /tmp/plain-repo/plugin.yml \<<'YAML'
            name: Plain
            description: Fixture with a repo name that doesn't end in -buildkite-plugin.
            YAML
            printf '#!/bin/bash\nexport PLAIN_REPO_HOOK_RAN=true\n' > /tmp/plain-repo/hooks/environment
            chmod +x /tmp/plain-repo/hooks/environment
            git -C /tmp/plain-repo init -q -b main
            git -C /tmp/plain-repo add -A
            git -C /tmp/plain-repo commit -q -m fixture
      - buildkite/fetch-plugin:
          plugin: "file:///tmp/hello-buildkite-plugin"
      - run:
          name: "Assert: '*-buildkite-plugin' name derivation"
          command: |
            set -euo pipefail
            test "$BUILDKITE_PLUGIN_ENV_PREFIX" = "BUILDKITE_PLUGIN_HELLO"
            test "$BUILDKITE_PLUGIN_NAME" = "HELLO"
            test -f "$BUILDKITE_PLUGIN_ROOT/plugin.yml"
            echo "OK: BUILDKITE_PLUGIN_ENV_PREFIX=$BUILDKITE_PLUGIN_ENV_PREFIX"
      - buildkite/configure:
          config: |
            greeting: "hello there"
            tags:
              - alpha
              - beta
            options:
              loud: true
      - run:
          name: "Assert: config flattening (scalar, array, nested object)"
          command: |
            set -euo pipefail
            test "$BUILDKITE_PLUGIN_HELLO_GREETING" = "hello there"
            test "$BUILDKITE_PLUGIN_HELLO_TAGS_0" = "alpha"
            test "$BUILDKITE_PLUGIN_HELLO_TAGS_1" = "beta"
            test "$BUILDKITE_PLUGIN_HELLO_OPTIONS_LOUD" = "true"
            echo "OK: config correctly flattened to BUILDKITE_PLUGIN_HELLO_* variables"
      - buildkite/install-agent-shim
      - buildkite/run-hooks:
          hooks: "environment,pre-checkout,post-checkout,pre-command,command,post-command,pre-exit"
          command: "echo running-fallback-command"
      - run:
          name: "Assert: environment-diff threaded across separate hook processes"
          command: |
            set -euo pipefail
            test "$HELLO_ENV_VAR" = "set-by-environment-hook"
            test "$HELLO_PRE_COMMAND_VAR" = "set-by-pre-command-hook"
            test "$HELLO_POST_COMMAND_VAR" = "set-by-post-command-hook"
            test -z "${HELLO_TO_BE_REMOVED:-}"
            echo "OK: additions AND a removal both threaded forward correctly, into a native step, via \$BASH_ENV"
      - buildkite/fetch-plugin:
          plugin: "file:///tmp/plain-repo"
      - run:
          name: "Assert: _GIT suffix for a full-URL plugin whose repo isn't *-buildkite-plugin"
          command: |
            set -euo pipefail
            test "$BUILDKITE_PLUGIN_ENV_PREFIX" = "BUILDKITE_PLUGIN_PLAIN_REPO_GIT"
            echo "OK: BUILDKITE_PLUGIN_ENV_PREFIX=$BUILDKITE_PLUGIN_ENV_PREFIX"
      - buildkite/fetch-plugin:
          plugin: "vault-secrets#v2.4.2"
      - run:
          name: "Assert: bare-name reference resolves under the buildkite-plugins org"
          command: |
            set -euo pipefail
            test "$BUILDKITE_PLUGIN_ENV_PREFIX" = "BUILDKITE_PLUGIN_VAULT_SECRETS"
            test -d "$BUILDKITE_PLUGIN_ROOT/hooks"
            echo "OK: fetched buildkite-plugins/vault-secrets-buildkite-plugin without any Vault credentials"
      - run:
          name: "Assert: buildkite-agent shim - hard-fails and shimmed subcommands"
          command: |
            set -euo pipefail
            ! buildkite-agent annotate "hi" --style success 2>/dev/null
            ! buildkite-agent pipeline upload foo.yml 2>/dev/null
            ! buildkite-agent step get label 2>/dev/null
            echo staged-artifact > /tmp/artifact-src.txt
            (cd /tmp && buildkite-agent artifact upload artifact-src.txt)
            test -f "$BUILDKITE_SHIM_ARTIFACT_DIR/artifact-src.txt"
            buildkite-agent meta-data set greeting "hi from meta-data"
            test "$(buildkite-agent meta-data get greeting)" = "hi from meta-data"
            echo "OK: hard-fails and shimmed subcommands all behaved as documented"

  # The build-in-a-hook itself: cci-labs/buildkite's fetch, config, shim and hook
  # runner are only faithful if they also work against a *real*, unmodified,
  # third-party Buildkite plugin fetched live from GitHub - not just this orb's own
  # bundled fixture. equinixmetal-buildkite/trivy is credential-free (it downloads its
  # own scanner binary and scans the filesystem), so it also serves as this orb's
  # canonical "does the whole thing actually work" test.
  test_real_plugin_trivy:
    executor: buildkite/docker
    steps:
      - checkout
      - buildkite/plugin:
          plugin: "equinixmetal-buildkite/trivy#v1.22.0"
          config: |
            exit-code: 0
            severity: "CRITICAL,HIGH"
          command: "echo scanning-repository"
      - run:
          name: "Assert: trivy's pre-checkout-hook exports threaded all the way to a native step"
          command: |
            set -euo pipefail
            test -n "$TRIVY_VERSION"
            test -n "$TRIVY_EXE_PATH"
            echo "OK: TRIVY_VERSION=$TRIVY_VERSION threaded from pre-checkout, across post-command, into \$BASH_ENV"

  # Gap-closing test: run-hooks.sh's 5-tier exit-code precedence table
  # (buildkite.com/docs/agent/lifecycle#exit-codes) had zero direct coverage -- the
  # bundled fixture only exercises the fully-successful path. Builds a small throwaway
  # fixture plugin whose every hook is independently fail/succeed-controlled via env
  # vars, and invokes run-hooks.sh directly (credential-free, no CircleCI job needs to
  # go red) for each precedence case.
  test_run_hooks_exit_precedence:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Build a fail/succeed-controllable fixture plugin
          command: |
            set -euo pipefail
            plugin_dir=/tmp/precedence-plugin
            mkdir -p "${plugin_dir}/hooks"
            for hook in pre-command command post-command pre-artifact post-artifact pre-exit; do
              upper="$(echo "${hook}" | tr '[:lower:]-' '[:upper:]_')"
              cat > "${plugin_dir}/hooks/${hook}" \<<EOF
            #!/bin/bash
            touch "\${MARKER_DIR}/${hook}-ran"
            exit "\${FAIL_${upper}:-0}"
            EOF
            done
            chmod +x "${plugin_dir}"/hooks/*
      - run:
          name: "Case 1+3: a gate-phase failure (pre-command) skips command, but pre-exit still runs"
          command: |
            set -euo pipefail
            export MARKER_DIR="$(mktemp -d)"
            export FAIL_PRE_COMMAND=5
            set +e
            BUILDKITE_PLUGIN_ROOT=/tmp/precedence-plugin \
              ORB_VAL_HOOKS="pre-command,command,post-command,pre-artifact,post-artifact,pre-exit" \
              ORB_VAL_COMMAND="" ORB_VAL_WORKING_DIRECTORY="$(mktemp -d)" BASH_ENV="$(mktemp)" \
              bash src/scripts/run-hooks.sh
            actual=$?
            set -e
            [ "${actual}" -eq 5 ] || { echo "FAIL: expected final exit 5 (the gate failure's own code), got ${actual}" >&2; exit 1; }
            [ -f "${MARKER_DIR}/pre-command-ran" ] || { echo "FAIL: pre-command should have run" >&2; exit 1; }
            [ -f "${MARKER_DIR}/command-ran" ] && { echo "FAIL: command hook ran despite the earlier gate failure" >&2; exit 1; }
            [ -f "${MARKER_DIR}/pre-exit-ran" ] || { echo "FAIL: pre-exit must always run, even after a gate failure" >&2; exit 1; }
            echo "OK: gate failure won immediately (exit 5), command never ran, pre-exit still ran."
      - run:
          name: "Case 2: a failing post-command overrides a successful command"
          command: |
            set -euo pipefail
            export MARKER_DIR="$(mktemp -d)"
            unset FAIL_PRE_COMMAND
            export FAIL_POST_COMMAND=6
            set +e
            BUILDKITE_PLUGIN_ROOT=/tmp/precedence-plugin \
              ORB_VAL_HOOKS="pre-command,command,post-command,pre-artifact,post-artifact,pre-exit" \
              ORB_VAL_COMMAND="" ORB_VAL_WORKING_DIRECTORY="$(mktemp -d)" BASH_ENV="$(mktemp)" \
              bash src/scripts/run-hooks.sh
            actual=$?
            set -e
            [ "${actual}" -eq 6 ] || { echo "FAIL: expected final exit 6 (post-command's own code), got ${actual}" >&2; exit 1; }
            echo "OK: a failing post-command (6) overrode the command's own successful (0) exit code."
      - run:
          name: "Case 4a: a pre-artifact failure is DISCARDED when the command already failed"
          command: |
            set -euo pipefail
            export MARKER_DIR="$(mktemp -d)"
            unset FAIL_POST_COMMAND
            export FAIL_COMMAND=7 FAIL_PRE_ARTIFACT=9
            set +e
            BUILDKITE_PLUGIN_ROOT=/tmp/precedence-plugin \
              ORB_VAL_HOOKS="pre-command,command,post-command,pre-artifact,post-artifact,pre-exit" \
              ORB_VAL_COMMAND="" ORB_VAL_WORKING_DIRECTORY="$(mktemp -d)" BASH_ENV="$(mktemp)" \
              bash src/scripts/run-hooks.sh
            actual=$?
            set -e
            [ "${actual}" -eq 7 ] || { echo "FAIL: expected final exit 7 (the command's own code; pre-artifact's 9 must be discarded), got ${actual}" >&2; exit 1; }
            echo "OK: pre-artifact's failure (9) was correctly discarded in favor of the command's own failure (7)."
      - run:
          name: "Case 4b: a pre-artifact failure WINS when the command succeeded"
          command: |
            set -euo pipefail
            export MARKER_DIR="$(mktemp -d)"
            unset FAIL_COMMAND
            export FAIL_PRE_ARTIFACT=9
            set +e
            BUILDKITE_PLUGIN_ROOT=/tmp/precedence-plugin \
              ORB_VAL_HOOKS="pre-command,command,post-command,pre-artifact,post-artifact,pre-exit" \
              ORB_VAL_COMMAND="" ORB_VAL_WORKING_DIRECTORY="$(mktemp -d)" BASH_ENV="$(mktemp)" \
              bash src/scripts/run-hooks.sh
            actual=$?
            set -e
            [ "${actual}" -eq 9 ] || { echo "FAIL: expected final exit 9 (pre-artifact's own code, since the command succeeded), got ${actual}" >&2; exit 1; }
            echo "OK: pre-artifact's failure (9) correctly won over the command's own success (0)."
      - run:
          name: "Case 5: a failing pre-exit always overrides everything else, even a gate failure"
          command: |
            set -euo pipefail
            export MARKER_DIR="$(mktemp -d)"
            export FAIL_PRE_COMMAND=5 FAIL_PRE_EXIT=3
            unset FAIL_PRE_ARTIFACT
            set +e
            BUILDKITE_PLUGIN_ROOT=/tmp/precedence-plugin \
              ORB_VAL_HOOKS="pre-command,command,post-command,pre-artifact,post-artifact,pre-exit" \
              ORB_VAL_COMMAND="" ORB_VAL_WORKING_DIRECTORY="$(mktemp -d)" BASH_ENV="$(mktemp)" \
              bash src/scripts/run-hooks.sh
            actual=$?
            set -e
            [ "${actual}" -eq 3 ] || { echo "FAIL: expected final exit 3 (pre-exit's own code, overriding the earlier gate failure), got ${actual}" >&2; exit 1; }
            echo "OK: pre-exit's failure (3) overrode even the earlier gate failure (5)."

  # Gap-closing test: configure.sh's config-flattening only had scalar/array/one-level-
  # nested coverage -- never a hyphenated key (Buildkite's own real-world convention) or
  # a genuinely empty config: (configure.sh's own documented clean no-op).
  test_configure_hyphenated_and_empty_config:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: A hyphenated config key flattens to the same _-joined env var name as any other
          command: |
            set -euo pipefail
            bash_env_file="$(mktemp)"
            BASH_ENV="${bash_env_file}" \
              BUILDKITE_PLUGIN_ENV_PREFIX="BUILDKITE_PLUGIN_TESTPLUGIN" \
              ORB_VAL_CONFIG=$'role-arn: arn:aws:iam::123456789012:role/foo\nsession-duration: 900' \
              bash src/scripts/configure.sh
            grep -qx "export BUILDKITE_PLUGIN_TESTPLUGIN_ROLE_ARN=arn:aws:iam::123456789012:role/foo" "${bash_env_file}"
            grep -qx "export BUILDKITE_PLUGIN_TESTPLUGIN_SESSION_DURATION=900" "${bash_env_file}"
            echo "OK: hyphenated keys 'role-arn'/'session-duration' flattened correctly."
      - run:
          name: An empty config is a clean no-op
          command: |
            set -euo pipefail
            bash_env_file="$(mktemp)"
            output="$(BASH_ENV="${bash_env_file}" \
              BUILDKITE_PLUGIN_ENV_PREFIX="BUILDKITE_PLUGIN_TESTPLUGIN" \
              ORB_VAL_CONFIG="" \
              bash src/scripts/configure.sh 2>&1)"
            if [ -s "${bash_env_file}" ]; then
              echo "FAIL: expected an empty config to write nothing to \$BASH_ENV, got:" >&2
              cat "${bash_env_file}" >&2
              exit 1
            fi
            case "${output}" in
              *"nothing to flatten"*) ;;
              *)
                echo "FAIL: expected the 'nothing to flatten' message, got: ${output}" >&2
                exit 1
                ;;
            esac
            echo "OK: an empty config is a clean no-op."

  # Regression test: fetch-plugin.sh rejects a #ref starting with '-' (git-option-
  # injection defense -- a ref like "--orphan=pwned" would otherwise be parsed by git as
  # an option, not a ref).
  test_fetch_plugin_ref_injection_regression:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Build a throwaway git fixture repo
          command: |
            set -euo pipefail
            export GIT_AUTHOR_NAME="orb test" GIT_AUTHOR_EMAIL="test@example.com"
            export GIT_COMMITTER_NAME="orb test" GIT_COMMITTER_EMAIL="test@example.com"
            rm -rf /tmp/injection-repo
            mkdir -p /tmp/injection-repo
            echo placeholder > /tmp/injection-repo/f.txt
            git -C /tmp/injection-repo init -q -b main
            git -C /tmp/injection-repo add -A
            git -C /tmp/injection-repo commit -q -m fixture
      - run:
          name: "Regression test - a ref starting with '-' is refused, never passed to git"
          command: |
            set +e
            error_output="$(ORB_VAL_PLUGIN='file:///tmp/injection-repo#--orphan=pwned' \
              ORB_VAL_PLUGIN_DIR="$(mktemp -d)" \
              ORB_VAL_ALWAYS_CLONE_FRESH="true" \
              BASH_ENV="$(mktemp)" \
              bash src/scripts/fetch-plugin.sh 2>&1)"
            actual_exit=$?
            set -e
            if [ "${actual_exit}" -eq 0 ]; then
              echo "FAIL: expected fetch-plugin.sh to reject the hostile ref, but it exited 0" >&2
              echo "${error_output}" >&2
              exit 1
            fi
            case "${error_output}" in
              *"is not a valid git ref"*) ;;
              *)
                echo "FAIL: expected the 'is not a valid git ref' error, got:" >&2
                echo "${error_output}" >&2
                exit 1
                ;;
            esac
            echo "OK: a ref starting with '-' was refused before ever reaching git."

  # Regression test: fetch-plugin.sh canonicalizes and verifies a git-URL subdirectory
  # plugin reference stays inside the clone (defends against
  # "repo.git/../../etc#main" escaping to somewhere like /tmp/etc).
  test_fetch_plugin_subdir_traversal_regression:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Build a throwaway git fixture repo, deliberately named "*.git"
          command: |
            set -euo pipefail
            export GIT_AUTHOR_NAME="orb test" GIT_AUTHOR_EMAIL="test@example.com"
            export GIT_COMMITTER_NAME="orb test" GIT_COMMITTER_EMAIL="test@example.com"
            rm -rf /tmp/traversal-repo.git
            mkdir -p /tmp/traversal-repo.git
            echo placeholder > /tmp/traversal-repo.git/f.txt
            git -C /tmp/traversal-repo.git init -q -b main
            git -C /tmp/traversal-repo.git add -A
            git -C /tmp/traversal-repo.git commit -q -m fixture
      - run:
          name: "Regression test - a subdirectory reference cannot escape the cloned repo"
          command: |
            set +e
            error_output="$(ORB_VAL_PLUGIN='file:///tmp/traversal-repo.git/../../etc#main' \
              ORB_VAL_PLUGIN_DIR="$(mktemp -d)" \
              ORB_VAL_ALWAYS_CLONE_FRESH="true" \
              BASH_ENV="$(mktemp)" \
              bash src/scripts/fetch-plugin.sh 2>&1)"
            actual_exit=$?
            set -e
            if [ "${actual_exit}" -eq 0 ]; then
              echo "FAIL: expected fetch-plugin.sh to refuse the escaping subdirectory reference, but it exited 0" >&2
              echo "${error_output}" >&2
              exit 1
            fi
            case "${error_output}" in
              *"outside the cloned plugin repository"*) ;;
              *)
                echo "FAIL: expected the 'outside the cloned plugin repository' error, got:" >&2
                echo "${error_output}" >&2
                exit 1
                ;;
            esac
            echo "OK: a subdirectory reference attempting to escape the cloned repo was refused."

  # Gap-closing test: fetch-plugin.yml's own comment documents that plugin-dir is
  # always cleared before a cache restore specifically to avoid staleness when two
  # DIFFERENT plugins are fetched into the same default plugin-dir in one job -- no CI
  # test proved that actually works end-to-end. Fetches two distinct local fixture
  # plugins into the exact same plugin-dir, back to back.
  test_fetch_plugin_idempotency:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Build two distinct throwaway git fixture repos
          command: |
            set -euo pipefail
            export GIT_AUTHOR_NAME="orb test" GIT_AUTHOR_EMAIL="test@example.com"
            export GIT_COMMITTER_NAME="orb test" GIT_COMMITTER_EMAIL="test@example.com"
            for name in idempotency-repo-one idempotency-repo-two; do
              rm -rf "/tmp/${name}"
              mkdir -p "/tmp/${name}"
              echo "${name}" > "/tmp/${name}/f.txt"
              git -C "/tmp/${name}" init -q -b main
              git -C "/tmp/${name}" add -A
              git -C "/tmp/${name}" commit -q -m fixture
            done
      - buildkite/fetch-plugin:
          plugin: "file:///tmp/idempotency-repo-one"
          plugin-dir: /tmp/shared-plugin-dir
      - run:
          name: Assert the first fetch resolved correctly
          command: |
            set -euo pipefail
            test "${BUILDKITE_PLUGIN_ENV_PREFIX}" = "BUILDKITE_PLUGIN_IDEMPOTENCY_REPO_ONE_GIT"
            test -f "${BUILDKITE_PLUGIN_ROOT}/f.txt"
      - buildkite/fetch-plugin:
          plugin: "file:///tmp/idempotency-repo-two"
          plugin-dir: /tmp/shared-plugin-dir
      - run:
          name: Assert the second fetch, into the SAME plugin-dir, did not reuse the first plugin's stale clone
          command: |
            set -euo pipefail
            test "${BUILDKITE_PLUGIN_ENV_PREFIX}" = "BUILDKITE_PLUGIN_IDEMPOTENCY_REPO_TWO_GIT"
            grep -qx "idempotency-repo-two" "${BUILDKITE_PLUGIN_ROOT}/f.txt"
            echo "OK: fetching a second, different plugin into the same plugin-dir did not reuse the first plugin's stale clone."

  # Gap-closing test, per the release-readiness audit: map-env.sh's CIRCLE_* ->
  # BUILDKITE_* mapping was only ever exercised INDIRECTLY inside buildkite/plugin
  # calls -- no test ever asserted the mapping itself is correct, unlike the sibling
  # bitbucket-pipes-orb's dedicated map_env_isolation job. Tests map-env in isolation
  # (not via the `plugin` aggregate): checkout, run map-env, assert its output directly
  # against the real CIRCLE_* variables it was derived from.
  map_env_isolation:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - buildkite/map-env
      - run:
          name: Assert the CIRCLE_* -> BUILDKITE_* mapping
          command: |
            set -euo pipefail
            test "${BUILDKITE}" = "true"
            test "${BUILDKITE_AGENT_NAME}" = "circleci"
            test "${BUILDKITE_BRANCH}" = "${CIRCLE_BRANCH:-}"
            test "${BUILDKITE_COMMIT}" = "${CIRCLE_SHA1}"
            test "${BUILDKITE_ORGANIZATION_SLUG}" = "${CIRCLE_PROJECT_USERNAME}"
            test "${BUILDKITE_PIPELINE_SLUG}" = "${CIRCLE_PROJECT_REPONAME}"
            test "${BUILDKITE_BUILD_NUMBER}" = "${CIRCLE_BUILD_NUM}"
            case "${BUILDKITE_REPO}" in
              *github.com*) test "${BUILDKITE_PIPELINE_PROVIDER}" = "github" ;;
              *) echo "Repo URL doesn't contain github.com; skipping provider-guess assertion." ;;
            esac
            # Not a PR build in this repo's own CI -- BUILDKITE_PULL_REQUEST must be the
            # literal string "false", matching Buildkite's own documented value exactly.
            test "${BUILDKITE_PULL_REQUEST}" = "false"
            echo "OK: map-env's CIRCLE_* -> BUILDKITE_* mapping looks correct."

  # Regression test for the reserved-shell-variable-name denylist added to
  # map-env.sh's extra-env handling in this pass (see that script's own comment) --
  # buildkite-orb was the one orb in this family without it; PATH/BASH_ENV/etc. must be
  # refused, not exported, since every later step in the job sources $BASH_ENV.
  test_map_env_extra_env_reserved_name_regression:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Regression test - PATH/BASH_ENV cannot be rewritten via extra-env"
          command: |
            set -euo pipefail
            bash_env_file="$(mktemp)"
            BASH_ENV="${bash_env_file}" \
              ORB_VAL_EXTRA_ENV=$'PATH=./evilbin:/usr/bin:/bin\nBASH_ENV=/tmp/pwned.sh\nGOOD_VAR=ok' \
              bash src/scripts/map-env.sh
            if grep -qE '^export (PATH|BASH_ENV)=' "${bash_env_file}"; then
              echo "FAIL: PATH or BASH_ENV was rewritten via extra-env:" >&2
              grep -E '^export (PATH|BASH_ENV)=' "${bash_env_file}" >&2
              exit 1
            fi
            if ! grep -q '^export GOOD_VAR=' "${bash_env_file}"; then
              echo "FAIL: expected GOOD_VAR to still be exported, got:" >&2
              cat "${bash_env_file}" >&2
              exit 1
            fi
            echo "OK: PATH/BASH_ENV cannot be rewritten via extra-env; a well-formed override still works."

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      - test_resolution_config_and_env_threading:
          name: "Testing resolution, config flattening and env-diff threading"
          filters: *filters
      - test_real_plugin_trivy:
          name: "Testing a real plugin (trivy, credential-free)"
          filters: *filters
      # Exercises the new, opt-in buildkite/docker-toolchains executor -- the vendor-
      # image research's one clean win across all four ecosystem-bridge orbs: a real,
      # actively-maintained (rebuilt daily) Buildkite-published image with node/go/aws-
      # cli/gcloud already on PATH, for a plugin whose hooks assume a real toolchain is
      # already there. Pulls the REAL default image (not a cheap override -- unlike
      # bitrise-orb's 10+GB opt-in Android image, this one is ~1GB and rebuilt daily,
      # so pulling the real default here is cheap enough to be worth it) and asserts
      # both that the plugin machinery works unmodified on this executor AND that the
      # toolchain it exists for is genuinely present.
      - buildkite/plugin:
          name: "Testing the docker-toolchains executor (real image, node/aws-cli present)"
          plugin: "equinixmetal-buildkite/trivy#v1.22.0"
          config: |
            exit-code: 0
          command: "echo scanning-repository"
          executor: buildkite/docker-toolchains
          post-steps:
            - run:
                name: "Assert: the plugin ran normally AND the toolchain image's own tools are on PATH"
                command: |
                  set -euo pipefail
                  test -n "$TRIVY_VERSION"
                  node --version
                  aws --version
                  echo "OK: TRIVY_VERSION=$TRIVY_VERSION, and node/aws-cli (from the image, not this orb) are present."
          filters: *filters
      - buildkite/plugin:
          name: "Testing the plugin job: executor override + native pre/post-steps"
          plugin: "equinixmetal-buildkite/trivy#v1.22.0"
          config: |
            exit-code: 0
          command: "echo scanning-repository"
          checkout: false
          executor:
            name: buildkite/machine
            image: ubuntu-2404:current
            resource_class: medium
          pre-steps:
            - checkout
          post-steps:
            - run:
                name: "Assert: post-steps run after the plugin's hooks, with their env visible"
                command: |
                  set -euo pipefail
                  test -n "$TRIVY_VERSION"
                  echo "OK: post-steps saw TRIVY_VERSION=$TRIVY_VERSION"
          filters: *filters
      - test_run_hooks_exit_precedence:
          filters: *filters
      - test_configure_hyphenated_and_empty_config:
          filters: *filters
      - test_fetch_plugin_ref_injection_regression:
          filters: *filters
      - test_fetch_plugin_subdir_traversal_regression:
          filters: *filters
      - test_fetch_plugin_idempotency:
          filters: *filters
      - map_env_isolation:
          filters: *filters
      - test_map_env_extra_env_reserved_name_regression:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *filters
          requires:
            - "Testing resolution, config flattening and env-diff threading"
            - "Testing a real plugin (trivy, credential-free)"
            - "Testing the docker-toolchains executor (real image, node/aws-cli present)"
            - "Testing the plugin job: executor override + native pre/post-steps"
            - test_run_hooks_exit_precedence
            - test_configure_hyphenated_and_empty_config
            - test_fetch_plugin_ref_injection_regression
            - test_fetch_plugin_subdir_traversal_regression
            - test_fetch_plugin_idempotency
            - map_env_isolation
            - test_map_env_extra_env_reserved_name_regression
      - orb-tools/publish:
          name: "Publish Dev"
          orb_name: cci-labs/buildkite
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          release_environment: orbs-dev
          github_token: GHI_TOKEN
      - orb-tools/publish:
          name: "Publish Production"
          orb_name: cci-labs/buildkite
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          filters: *release-filters
          release_environment: orbs-prod
          github_token: GHI_TOKEN
